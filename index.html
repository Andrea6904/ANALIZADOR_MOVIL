<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analizador de Celular — Visor de informe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hoja">
    <header class="cabecera">
      <p class="dispositivo" id="dispositivo">Ningún análisis cargado</p>
      <p class="meta" id="meta">
        Coloca el archivo <strong>analisis_celular.json</strong> (exportado por el script) junto a esta página,
        o selecciónalo manualmente:
      </p>
      <label class="cargar" for="archivo-json">Seleccionar archivo JSON</label>
      <input type="file" id="archivo-json" accept="application/json,.json" hidden>
    </header>

    <div id="contenedor-secciones"></div>
  </div>
  <footer>Visor del Analizador de Características de Celular (WSL)</footer>

  <script src="script.js"></script>
</body>
</html>
